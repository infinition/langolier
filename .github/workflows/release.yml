name: Desktop builds and releases

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            args: --bundles nsis
            binary: src-tauri/target/release/langolier.exe
          - os: ubuntu-24.04
            artifact: linux-x64
            args: --bundles deb,rpm,appimage
            binary: src-tauri/target/release/langolier
          # macos-26 carries the SDK that holds FoundationModels; on an older
          # image the build still succeeds but drops the Apple engine, which
          # the check below refuses to ship silently.
          - os: macos-26
            artifact: macos-universal
            args: --target universal-apple-darwin --bundles app,dmg
            binary: src-tauri/target/universal-apple-darwin/release/langolier
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: macOS architectures
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm libfuse2t64
      # llama-cpp-sys-2 builds llama.cpp with cmake, present on all three images.
      - run: cmake --version
      - run: npm ci
      # bash, because PowerShell only reports the last command's exit code:
      # a formatting failure went unnoticed on Windows.
      - name: Formatting and lints
        shell: bash
        run: |
          set -e
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # The HTTP surface is tested here: its routing reaches the palette window,
      # so with the desktop feature the test binary links the Windows GUI stack,
      # which fails to load on images whose uxtheme.dll lacks the dark mode
      # ordinals. The server those tests exercise is the headless one anyway.
      - name: Server-only tests
        run: cargo test --locked --no-default-features --manifest-path src-tauri/Cargo.toml
      - name: Dataset tooling tests
        run: python scripts/test_dataset.py
      # Tauri embeds the frontend; a bare cargo build can retain the dev URL.
      - name: Build production application and packages
        run: npm run tauri build -- ${{ matrix.args }}
      # The bridge to the model macOS carries is compiled only when the SDK
      # holds the framework, so a runner without it would quietly produce a
      # build missing the engine. Both slices of the universal binary carry it.
      - name: Apple engine compiled in
        if: runner.os == 'macOS'
        run: |
          set -e
          for arch in arm64 x86_64; do
            if ! otool -arch "$arch" -L "${{ matrix.binary }}" | grep -q FoundationModels; then
              echo "Apple engine missing from the $arch slice"
              exit 1
            fi
          done
          echo "Apple engine present in both slices"
      - name: Chatbot launchers
        shell: bash
        run: node scripts/make-runners.mjs "${{ matrix.binary }}" "release-assets/chatbot-runners-${{ matrix.artifact }}" "Chatbot"
      - name: Prepare assets
        shell: bash
        run: |
          set -e
          cd release-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "chatbot-runners-${{ matrix.artifact }}.zip" "chatbot-runners-${{ matrix.artifact }}"
          else
            zip -qry "chatbot-runners-${{ matrix.artifact }}.zip" "chatbot-runners-${{ matrix.artifact }}"
          fi
          rm -rf "chatbot-runners-${{ matrix.artifact }}"
          cd ..
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: langolier-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: langolier-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-assets/*
          fail_on_unmatched_files: true
