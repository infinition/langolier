name: Desktop builds and releases

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            args: --bundles nsis
            binary: src-tauri/target/release/langolier.exe
          - os: ubuntu-24.04
            artifact: linux-x64
            args: --bundles deb,rpm,appimage
            binary: src-tauri/target/release/langolier
          - os: macos-15
            artifact: macos-universal
            args: --target universal-apple-darwin --bundles app,dmg
            binary: src-tauri/target/universal-apple-darwin/release/langolier
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: macOS architectures
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm libfuse2t64
      # llama-cpp-sys-2 builds llama.cpp with cmake, present on all three images.
      - run: cmake --version
      - run: npm ci
      - name: Formatting and lints
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Dataset tooling tests
        run: python scripts/test_dataset.py
      # Tauri embeds the frontend; a bare cargo build can retain the dev URL.
      - name: Build production application and packages
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Chatbot launchers
        shell: bash
        run: node scripts/make-runners.mjs "${{ matrix.binary }}" "release-assets/chatbot-runners-${{ matrix.artifact }}" "Chatbot"
      - name: Prepare assets
        shell: bash
        run: |
          set -e
          cd release-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "chatbot-runners-${{ matrix.artifact }}.zip" "chatbot-runners-${{ matrix.artifact }}"
          else
            zip -qry "chatbot-runners-${{ matrix.artifact }}.zip" "chatbot-runners-${{ matrix.artifact }}"
          fi
          rm -rf "chatbot-runners-${{ matrix.artifact }}"
          cd ..
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: langolier-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: langolier-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/v0.2.0.md
          files: release-assets/*
          fail_on_unmatched_files: true
