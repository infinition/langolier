<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#111310" />
<title>Assistant</title>
<style>
  /* Themes: each name sets its variables, the rest is shared. */
  :root, [data-theme="nuit"] {
    --bg: #111310; --panel: #191c17; --line: #2a2e26; --text: #e9ebe3; --muted: #92978a;
    --accent: #d7f98a; --accent-ink: #1a1f0e; --user: #23301a; --assistant: #191c17;
  }
  [data-theme="clair"] {
    --bg: #f6f5f0; --panel: #ffffff; --line: #e3e1d8; --text: #1e211b; --muted: #6f756a;
    --accent: #2f6b2a; --accent-ink: #ffffff; --user: #e8f1dc; --assistant: #ffffff;
  }
  [data-theme="sauge"] {
    --bg: #eef2ea; --panel: #f9fbf6; --line: #d3dccb; --text: #22301f; --muted: #6a7a63;
    --accent: #5f8f5a; --accent-ink: #ffffff; --user: #d9e8d0; --assistant: #f9fbf6;
  }
  [data-theme="sable"] {
    --bg: #f4ecdd; --panel: #fbf6ea; --line: #e0d3b8; --text: #3a2f1e; --muted: #86755a;
    --accent: #b8722d; --accent-ink: #ffffff; --user: #efdfc0; --assistant: #fbf6ea;
  }
  [data-theme="encre"] {
    --bg: #0e1220; --panel: #161b2e; --line: #262d47; --text: #e6e9f5; --muted: #8b93b3;
    --accent: #7aa2ff; --accent-ink: #0b1020; --user: #1e2747; --assistant: #161b2e;
  }
  [data-theme="corail"] {
    --bg: #1b1214; --panel: #24181b; --line: #3a2529; --text: #f4e9ea; --muted: #a88b90;
    --accent: #ff7a6e; --accent-ink: #2a0f0c; --user: #3a2226; --assistant: #24181b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, Inter, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
    /* dvh follows the iOS keyboard and address bar; vh is the fallback. */
    min-height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
    font-weight: 700; font-size: 18px; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  header .new { margin-left: auto; }
  main { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 22px 0 10px; }
  .thread {
    max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
    padding: 0 calc(20px + env(safe-area-inset-right)) 0 calc(20px + env(safe-area-inset-left));
  }
  .msg { display: flex; gap: 10px; align-items: flex-end; animation: in .22s ease-out; }
  .msg.user { flex-direction: row-reverse; }
  .msg .avatar { width: 28px; height: 28px; border-radius: 9px; font-size: 13px; }
  .bubble {
    max-width: 78%; padding: 11px 15px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--assistant); word-wrap: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user); border-bottom-right-radius: 5px; }
  .msg.assistant .bubble { border-bottom-left-radius: 5px; }
  .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 4px; }
  .bubble pre { white-space: pre-wrap; margin: 6px 0; }
  .sources { font-size: 11.5px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .phase { color: var(--muted); font-size: 13px; animation: pulse 1.4s infinite; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink .9s steps(2) infinite; }
  footer {
    padding: 12px calc(20px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  form { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    font: inherit; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 8px 12px; font-weight: 500; font-size: 13px; }
  .error { color: #d9534f; }
  .msg.assistant .bubble { position: relative; }
  .copy-btn {
    position: absolute; top: 6px; right: 6px; display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 8px; font: inherit; font-size: 10.5px; letter-spacing: .3px; border-radius: 7px;
    color: var(--muted); background: rgba(127,127,127,.12); border: 1px solid var(--line);
    opacity: 0; transform: translateY(-2px); cursor: pointer; z-index: 2;
    transition: opacity .18s, transform .18s, color .15s;
  }
  .copy-btn svg { width: 12px; height: 12px; }
  .msg.assistant:hover .copy-btn, .copy-btn.done, .copy-btn.failed { opacity: 1; transform: none; transition-delay: 1s; }
  .copy-btn.done, .copy-btn.failed { transition-delay: 0s; }
  .copy-btn.done { color: var(--accent); border-color: var(--accent); animation: copy-pop .35s cubic-bezier(.2,.9,.3,1.4); }
  .copy-btn.failed { color: #d9534f; }
  @keyframes copy-pop { 40% { transform: scale(1.18); } }
  .hint { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); margin: 8px 0 0; }
  .gear { display: none; background: none; border: 0; padding: 0 4px; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; opacity: .55; }
  .gear:hover { opacity: 1; }
  .gear.show { display: inline-block; }
  .banner { display: none; margin: 0; padding: 9px 20px; font-size: 12.5px; line-height: 1.5; background: rgba(226,180,145,.14); color: var(--text); border-bottom: 1px solid var(--line); }
  .banner.show { display: block; }
  .banner code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  dialog {
    border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text);
    padding: 20px 22px; width: min(520px, 92vw); font-size: 14px;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 4px; font-size: 15px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
  dialog section { border-top: 1px solid var(--line); padding: 14px 0 4px; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  dialog input, dialog select {
    width: 100%; font: inherit; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); outline: none;
  }
  dialog input:focus, dialog select:focus { border-color: var(--accent); }
  dialog .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  dialog .row button { padding: 9px 14px; font-size: 13px; }
  dialog .status { min-height: 1.4em; font-size: 12.5px; margin-top: 12px; }
  dialog .close { margin-left: auto; }
  dialog .chosen { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Palette mode: a floating bar in a borderless, transparent window. The
     bar and the thread share one frosted material; the desktop shows through. */
  body.palette {
    margin: 6px; min-height: calc(100vh - 12px); padding: 12px; gap: 10px; border-radius: 24px;
    background: rgba(20, 20, 23, 0.55); border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter: blur(34px) saturate(1.7); -webkit-backdrop-filter: blur(34px) saturate(1.7);
  }
  html:has(body.palette) { background: transparent; }
  body.palette header, body.palette .banner, body.palette .hint { display: none; }
  body.palette footer, body.palette main { background: transparent; border: 0; box-shadow: none; border-radius: 0; }
  body.palette footer { border-bottom: 1px solid rgba(255,255,255,.08); }
  body.palette .bubble { border: 0; }
  body.palette footer { order: 1; padding: 4px 4px 10px; }
  body.palette main { order: 2; flex: 0 1 auto; padding: 12px 0 4px; }
  body.palette main:empty, body.palette main:has(.thread:empty) { display: none; }
  body.palette .thread { gap: 12px; }
  body.palette .msg .avatar { display: none; }
  body.palette .msg.user .bubble { background: rgba(230,160,107,.2); border-color: rgba(230,160,107,.42); color: var(--text); }
  body.palette .msg.assistant .bubble { max-width: 94%; background: rgba(10,10,12,.55); border-color: rgba(255,255,255,.1); box-shadow: 0 10px 30px rgba(0,0,0,.3); color: #f1f1f2; }
  body.palette .sources { border-top-color: rgba(255,255,255,.12); color: rgba(241,241,242,.55); }
  body.palette textarea { min-height: 44px; background: transparent; border-color: transparent; font-size: 17px; }
  body.palette textarea:focus { border-color: transparent; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes pulse { 50% { opacity: .5; } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <div class="avatar" id="avatar">?</div>
  <div>
    <h1 id="name">Assistant</h1>
    <p id="welcome"></p>
  </div>
  <button class="ghost new" id="new" type="button"></button>
</header>
<p class="banner" id="banner"></p>
<main><div class="thread" id="thread"></div></main>
<footer>
  <form id="form">
    <textarea id="q" rows="1" autofocus></textarea>
    <button id="send" type="submit"></button>
  </form>
  <p class="hint"><span id="hint"></span><button class="gear" id="gear" type="button" title="Administration">⚙</button></p>
</footer>
<dialog id="admin">
  <h2 id="admin-title"></h2>
  <p id="admin-intro"></p>
  <section>
    <label for="secret" id="secret-label"></label>
    <input id="secret" type="password" autocomplete="off" />
  </section>
  <section id="import-section" hidden>
    <label id="import-label"></label>
    <input id="file" type="file" accept=".langolier" hidden />
    <div class="row">
      <button id="choose" class="ghost" type="button"></button>
      <span id="chosen" class="chosen"></span>
    </div>
    <div class="row"><button id="import" type="button"></button></div>
  </section>
  <section id="restore-section" hidden>
    <label for="bundles" id="restore-label"></label>
    <select id="bundles"></select>
    <div class="row">
      <button id="restore" type="button"></button>
      <button id="delete" class="ghost" type="button"></button>
    </div>
  </section>
  <div class="status" id="status"></div>
  <div class="row"><button id="admin-close" class="ghost close" type="button"></button></div>
</dialog>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let fr = (navigator.language || "").toLowerCase().startsWith("fr");
  let T;
  const STRINGS = (fr) => fr ? {
    new: "Nouvelle conversation", ask: "Posez votre question…", send: "Envoyer", connecting: "Connexion…",
    error: "Erreur", none: "Aucune réponse reçue.", configFailed: "Impossible de charger la configuration : ",
    copy: "Copier", copied: "Copié", copyFailed: "Copie impossible", copyTitle: "Copier la réponse",
    grounded: "Réponses fondées uniquement sur les connaissances de cet assistant.",
    cited: " Les sources citées apparaissent sous chaque réponse.",
    adminTitle: "Administration", adminIntro: "Remplacer le cerveau de cet assistant par un autre fichier .langolier, ou revenir à une version précédente. Les conversations sont conservées.",
    secret: "Secret d’administration", importLabel: "Importer un fichier .langolier", importBtn: "Importer",
    restoreLabel: "Versions disponibles", restoreBtn: "Restaurer", deleteBtn: "Supprimer", close: "Fermer",
    kit: "livré avec le kit", active: "en cours", pickFile: "Choisissez un fichier.", pickBundle: "Choisissez une version.",
    uploading: "Envoi…", working: "En cours…", imported: "Importé : ", restored: "Restauré : ", deleted: "Supprimé.",
    confirmDelete: "Supprimer cette version ? Elle ne pourra plus être restaurée.",
    forceAsk: "Continuer quand même, avec la recherche par mots seulement ?",
    choose: "Choisir un fichier…", noFile: "Aucun fichier choisi", adminTip: "Administration",
  } : {
    new: "New conversation", ask: "Ask your question…", send: "Send", connecting: "Connecting…",
    error: "Error", none: "No answer received.", configFailed: "Could not load the configuration: ",
    copy: "Copy", copied: "Copied", copyFailed: "Copy failed", copyTitle: "Copy the answer",
    grounded: "Answers grounded only in this assistant's knowledge.",
    cited: " Cited sources appear under each answer.",
    adminTitle: "Administration", adminIntro: "Replace this assistant's brain with another .langolier file, or go back to an earlier version. Conversations are kept.",
    secret: "Admin secret", importLabel: "Import a .langolier file", importBtn: "Import",
    restoreLabel: "Available versions", restoreBtn: "Restore", deleteBtn: "Delete", close: "Close",
    kit: "shipped with the kit", active: "running", pickFile: "Pick a file.", pickBundle: "Pick a version.",
    uploading: "Uploading…", working: "Working…", imported: "Imported: ", restored: "Restored: ", deleted: "Deleted.",
    confirmDelete: "Delete this version? It cannot be restored afterwards.",
    forceAsk: "Continue anyway, with word search only?",
    choose: "Choose a file…", noFile: "No file chosen", adminTip: "Administration",
  };
  // Messages the server sends in English: phases, health notices, errors.
  const SERVER_FR = [
    ["Searching your memory", "Recherche dans votre mémoire"],
    ["Writing the answer", "Rédaction de la réponse"],
    ["Verifying the answer", "Vérification de la réponse"],
    ["Wrong secret.", "Mauvais secret."],
    ["Too many wrong secrets. Try again in a few minutes.", "Trop de mauvais secrets. Réessayez dans quelques minutes."],
    ["Import is disabled for this chatbot.", "L’import est désactivé pour ce chatbot."],
    ["Restore is disabled for this chatbot.", "La restauration est désactivée pour ce chatbot."],
    ["The bundle the kit shipped with cannot be deleted.", "Le bundle livré avec le kit ne peut pas être supprimé."],
    ["This bundle is the one running. Restore another one first.", "Ce bundle est celui en cours. Restaurez-en un autre d’abord."],
    ["Unknown bundle.", "Bundle inconnu."],
    ["Invalid bundle id.", "Identifiant de bundle invalide."],
    ["Upload cut short.", "Envoi interrompu."],
    ["This file is not a Langolier bundle.", "Ce fichier n’est pas un bundle Langolier."],
    ["Expected a JSON body with an id.", "Requête invalide."],
    ["not found", "introuvable"],
    ["empty question", "question vide"],
    ["This conversation has reached its limit. Open a new one to continue.", "Cette conversation a atteint sa limite. Ouvrez-en une nouvelle pour continuer."],
    ["This assistant's daily quota is spent. Try again tomorrow.", "Le quota quotidien de cet assistant est atteint. Réessayez demain."],
    ["The model returned an empty answer.", "Le modèle a renvoyé une réponse vide."],
    ["Engine stream cut short; answer not saved.", "Flux du moteur interrompu ; réponse non enregistrée."],
    ["A generation is already running", "Une génération est déjà en cours"],
    [/^This bundle needs an embedding model that is not available here: (.*) Send again with force=1 to accept word search only\.$/, "Ce bundle a besoin d’un modèle d’embeddings absent ici : $1"],
    [/^A bundle must be between 1 byte and (\d+) MB\.$/, "Un bundle doit faire entre 1 octet et $1 Mo."],
    [/^A bundle must hold exactly one profile, this one holds (\d+)\.$/, "Un bundle doit contenir un seul profil, celui-ci en contient $1."],
    [/^Chat model missing: (.*) \(expected in the models\/ folder\)\.$/, "Modèle de conversation absent : $1 (attendu dans le dossier models/)."],
    [/^Embedding model missing: (.*) - word search only\.$/, "Modèle d’embeddings absent : $1, recherche par mots seulement."],
    [/^Chat model "(.*)" missing from Ollama: (.*)$/, "Modèle de conversation « $1 » absent d’Ollama : $2"],
    [/^Embedding model "(.*)" missing from Ollama: (.*) - word search only until then\.$/, "Modèle d’embeddings « $1 » absent d’Ollama : $2, recherche par mots seulement en attendant."],
    [/^Ollama is not answering on (.*): answers will fail until it starts\.$/, "Ollama ne répond pas sur $1 : les réponses échoueront jusqu’à son démarrage."],
    [/^Ollama is not answering on (.*): word search only\.$/, "Ollama ne répond pas sur $1 : recherche par mots seulement."],
    [/^Chat model not downloaded: (.*)\. Install it from the Engines page\.$/, "Modèle de conversation non téléchargé : $1."],
    [/^Sorry, something went wrong: (.*)$/, "Désolé, une erreur est survenue : $1"],
  ];
  const fromServer = (s) => {
    if (!fr || typeof s !== "string") return s;
    for (const [en, out] of SERVER_FR) {
      if (en instanceof RegExp) { if (en.test(s)) return s.replace(en, out); }
      else if (s === en) return out;
    }
    return s;
  };
  // The profile may pin the page language; otherwise the browser decides.
  function applyLanguage(pinned) {
    if (pinned === "en" || pinned === "fr") fr = pinned === "fr";
    T = STRINGS(fr);
    document.documentElement.lang = fr ? "fr" : "en";
    for (const [id, key] of [["new", "new"], ["send", "send"], ["admin-title", "adminTitle"], ["admin-intro", "adminIntro"],
      ["secret-label", "secret"], ["import-label", "importLabel"], ["import", "importBtn"], ["restore-label", "restoreLabel"],
      ["restore", "restoreBtn"], ["delete", "deleteBtn"], ["admin-close", "close"], ["choose", "choose"]]) $(id).textContent = T[key];
    $("q").placeholder = T.ask;
    $("gear").title = T.adminTip;
    if (!$("file").files.length) $("chosen").textContent = T.noFile;
  }
  applyLanguage("auto");

  const thread = $("thread"), q = $("q"), send = $("send"), form = $("form");
  // #palette: the launcher's floating bar. Own conversation, Escape hides it.
  const palette = location.hash === "#palette";
  const CONV_KEY = palette ? "conversation-palette" : "conversation";
  if (palette) {
    document.body.classList.add("palette");
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { e.preventDefault(); fetch("/api/ui/hide", { method: "POST" }).catch(() => {}); }
    });
    window.addEventListener("focus", () => q.focus());
  }
  let config = { name: "Assistant" };
  let conversation = localStorage.getItem(CONV_KEY) || "";
  let busy = false;

  const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Minimal formatting: bold, code, code blocks. No incoming HTML.
  const render = (s) => escapeHtml(s)
    .replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  const initial = (name) => (name.trim()[0] || "?").toUpperCase();

  function avatarNode() {
    const el = document.createElement("div");
    el.className = "avatar";
    if (config.avatar) el.innerHTML = `<img alt="" src="${config.avatar}">`;
    else el.textContent = initial(config.name);
    return el;
  }
  function addMessage(role, content, sources) {
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    if (role === "assistant") msg.appendChild(avatarNode());
    const b = document.createElement("div");
    b.className = "bubble";
    b.innerHTML = render(content || "");
    if (config.show_sources !== false && sources && sources.length) b.appendChild(sourcesNode(sources));
    if (role === "assistant" && content) b.appendChild(copyNode(() => content));
    msg.appendChild(b);
    thread.appendChild(msg);
    scroll();
    return b;
  }
  const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
  const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const area = document.createElement("textarea"); area.value = text; area.setAttribute("readonly", "");
      area.style.position = "fixed"; area.style.opacity = "0"; document.body.appendChild(area); area.select();
      const ok = document.execCommand("copy"); area.remove(); return ok;
    }
  }
  // Copy button on an answer: shown on hover after a beat, pops on click.
  function copyNode(getText) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "copy-btn"; b.title = T.copyTitle;
    b.innerHTML = `${COPY_ICON}<span>${T.copy}</span>`;
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const ok = await copyText(getText());
      b.className = "copy-btn " + (ok ? "done" : "failed");
      b.innerHTML = `${ok ? CHECK_ICON : COPY_ICON}<span>${ok ? T.copied : T.copyFailed}</span>`;
      setTimeout(() => { b.className = "copy-btn"; b.innerHTML = `${COPY_ICON}<span>${T.copy}</span>`; }, 1600);
    });
    return b;
  }
  function sourcesNode(sources) {
    const el = document.createElement("div");
    el.className = "sources";
    el.textContent = sources.slice(0, 4).map((s, i) => `[${i + 1}] ${s.name}`).join("  ·  ");
    return el;
  }
  const scroll = () => requestAnimationFrame(() => (document.querySelector("main").scrollTop = 1e9));

  async function loadConfig() {
    const r = await fetch("/api/config"); config = await r.json();
    applyLanguage(config.language || "auto");
    document.documentElement.dataset.theme = config.theme || "nuit";
    document.title = config.name;
    $("name").textContent = config.name;
    $("welcome").textContent = config.welcome || "";
    $("hint").textContent = T.grounded + (config.show_sources === false ? "" : T.cited);
    const av = $("avatar"); av.innerHTML = "";
    if (config.avatar) av.innerHTML = `<img alt="" src="${config.avatar}">`; else av.textContent = initial(config.name);
    const admin = config.admin || {};
    $("gear").classList.toggle("show", !!admin.enabled);
    $("import-section").hidden = !admin.import;
    $("restore-section").hidden = !admin.restore;
  }
  async function loadHealth() {
    try {
      const r = await fetch("/api/health"); const h = await r.json();
      const b = $("banner");
      if (h.problems && h.problems.length) {
        b.innerHTML = (h.degraded ? "⚠︎ " : "✖ ") + h.problems.map((x) => escapeHtml(fromServer(x))).join("<br>").replace(/`([^`]+)`/g, "<code>$1</code>");
        b.classList.add("show");
      } else b.classList.remove("show");
    } catch (e) { /* the page stays usable */ }
  }
  async function loadHistory() {
    thread.innerHTML = "";
    if (conversation) {
      const r = await fetch(`/api/messages?id=${encodeURIComponent(conversation)}`);
      if (r.ok) {
        const list = await r.json();
        if (!list.length) conversation = "";
        for (const m of list) addMessage(m.role, m.content, m.role === "assistant" ? m.sources : null);
      } else conversation = "";
    }
    if (!thread.children.length && config.welcome && !palette) addMessage("assistant", config.welcome);
  }
  async function ask(text) {
    busy = true; send.disabled = true; q.value = ""; q.style.height = "";
    addMessage("user", text);
    const bubble = addMessage("assistant", "");
    const phase = document.createElement("span"); phase.className = "phase"; phase.textContent = T.connecting;
    bubble.appendChild(phase);
    let answer = "";
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation_id: conversation, question: text }) });
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
      const caret = document.createElement("span"); caret.className = "caret";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const ev = /^event: (.*)$/m.exec(frame)?.[1]; const data = /^data: (.*)$/m.exec(frame)?.[1];
          if (!ev || data === undefined) continue;
          const payload = JSON.parse(data);
          if (ev === "conversation") { conversation = payload.id; localStorage.setItem(CONV_KEY, conversation); }
          else if (ev === "phase") phase.textContent = fromServer(payload);
          else if (ev === "token") { answer += payload; bubble.innerHTML = render(answer); bubble.appendChild(caret); scroll(); }
          else if (ev === "done") { bubble.innerHTML = render(payload.content); if (config.show_sources !== false && payload.sources?.length) bubble.appendChild(sourcesNode(payload.sources)); if (payload.content) bubble.appendChild(copyNode(() => payload.content)); }
          else if (ev === "error") { bubble.innerHTML = `<span class="error">${escapeHtml(fromServer(payload.error) || T.error)}</span>`; }
        }
      }
      if (!answer && !bubble.textContent.trim()) bubble.textContent = T.none;
    } catch (e) {
      bubble.innerHTML = `<span class="error">${escapeHtml(String(e))}</span>`;
    } finally {
      busy = false; send.disabled = false; q.focus(); scroll();
    }
  }

  // Administration: import, restore, delete. The secret only lives in this
  // tab's session storage and travels in a header, never in the URL.
  const dlg = $("admin"), status = $("status"), secret = $("secret"), bundles = $("bundles");
  secret.value = sessionStorage.getItem("admin-secret") || "";
  const headers = () => ({ "X-Admin-Token": secret.value.trim() });
  const say = (text, isError) => { status.textContent = text; status.className = "status" + (isError ? " error" : ""); };
  const when = (t) => new Date(t * 1000).toLocaleString(fr ? "fr-FR" : "en-GB", { dateStyle: "medium", timeStyle: "short" });
  const mb = (n) => `${(n / 1048576).toFixed(1)} ${fr ? "Mo" : "MB"}`;
  function fill(list) {
    bundles.innerHTML = "";
    for (const b of list.bundles || []) {
      const o = document.createElement("option");
      o.value = b.id;
      const tags = [b.active ? T.active : "", b.kit ? T.kit : ""].filter(Boolean).join(", ");
      o.textContent = `${b.name}  ·  ${when(b.imported_at)}  ·  ${mb(b.size)}${tags ? `  (${tags})` : ""}`;
      o.dataset.active = b.active ? "1" : ""; o.dataset.kit = b.kit ? "1" : "";
      bundles.appendChild(o);
    }
    syncButtons();
  }
  function syncButtons() {
    const o = bundles.selectedOptions[0];
    $("restore").disabled = !o || o.dataset.active === "1";
    $("delete").disabled = !o || o.dataset.active === "1" || o.dataset.kit === "1";
  }
  async function call(path, init) {
    const r = await fetch(path, { ...init, headers: { ...headers(), ...(init?.headers || {}) } });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(fromServer(body.error) || r.statusText);
    return body;
  }
  async function refresh() {
    say(T.working);
    const list = await call("/api/admin/bundles");
    fill(list); say("");
  }
  async function applied(prefix, name) {
    sessionStorage.setItem("admin-secret", secret.value.trim());
    say(prefix + name);
    conversation = ""; localStorage.removeItem(CONV_KEY);
    await loadConfig(); await loadHistory(); await loadHealth();
  }
  $("choose").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", () => { const f = $("file").files[0]; $("chosen").textContent = f ? f.name : T.noFile; });
  $("gear").addEventListener("click", () => { say(""); dlg.showModal(); if (secret.value) refresh().catch((e) => say(e.message, true)); });
  $("admin-close").addEventListener("click", () => dlg.close());
  secret.addEventListener("change", () => refresh().catch((e) => say(e.message, true)));
  bundles.addEventListener("change", syncButtons);
  $("import").addEventListener("click", async () => {
    const f = $("file").files[0];
    if (!f) return say(T.pickFile, true);
    say(T.uploading);
    const send = (force) => call(`/api/admin/import${force ? "?force=1" : ""}`, { method: "POST", body: f, headers: { "Content-Type": "application/octet-stream" } });
    try {
      let r;
      try { r = await send(false); }
      catch (e) {
        if (!/(force=1|embeddings absent ici)/.test(e.message) || !confirm(`${e.message}\n\n${T.forceAsk}`)) throw e;
        r = await send(true);
      }
      fill(r.list); $("file").value = ""; $("chosen").textContent = T.noFile;
      await applied(T.imported, r.name);
    } catch (e) { say(e.message, true); }
  });
  $("restore").addEventListener("click", async () => {
    const id = bundles.value;
    if (!id) return say(T.pickBundle, true);
    say(T.working);
    try {
      const r = await call("/api/admin/restore", { method: "POST", body: JSON.stringify({ id }), headers: { "Content-Type": "application/json" } });
      fill(r.list);
      await applied(T.restored, r.name);
    } catch (e) { say(e.message, true); }
  });
  $("delete").addEventListener("click", async () => {
    const id = bundles.value;
    if (!id) return say(T.pickBundle, true);
    if (!confirm(T.confirmDelete)) return;
    try {
      const r = await call("/api/admin/delete", { method: "POST", body: JSON.stringify({ id }), headers: { "Content-Type": "application/json" } });
      fill(r.list); say(T.deleted);
    } catch (e) { say(e.message, true); }
  });

  form.addEventListener("submit", (e) => { e.preventDefault(); const t = q.value.trim(); if (t && !busy) ask(t); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  q.addEventListener("input", () => { q.style.height = ""; q.style.height = Math.min(160, q.scrollHeight) + "px"; });
  $("new").addEventListener("click", () => { conversation = ""; localStorage.removeItem(CONV_KEY); loadHistory(); q.focus(); });
  loadConfig().then(loadHistory).then(loadHealth).catch((e) => addMessage("assistant", T.configFailed + e));
  setInterval(loadHealth, 30000);
})();
</script>
</body>
</html>
